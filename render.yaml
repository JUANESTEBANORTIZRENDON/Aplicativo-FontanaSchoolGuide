services:
  - type: web
    name: fontana-school-guide
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: STALLED_DAYS
        value: "7"
      - key: CERTIFICATES_ENABLED
        value: "false"
      # buildCommand pasa a "npm ci && npm run build && npx prisma migrate deploy"
      # solo después de marcar la línea base en producción (ver README, orden de despliegue).
